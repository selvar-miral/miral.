<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Meme ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1f1124 0%, #0b0710 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* الشاشة الأولى: البداية */
    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0710;
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .start-btn {
      padding: 18px 35px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 35px;
      cursor: pointer;
      background: linear-gradient(135deg, #2b1b36 0%, #3d224d 100%);
      color: #ff8fab;
      border: 1px solid rgba(255, 143, 171, 0.4);
      box-shadow: 0 5px 20px rgba(255, 105, 180, 0.4);
    }

    /* الواجهة الرئيسية */
    #mainScreen {
      display: none;
      text-align: center;
      z-index: 10;
      padding: 20px;
      max-width: 400px;
      width: 90%;
    }

    /* القلوب المتحركة */
    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 22px;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.6); opacity: 0.8; }
      100% { transform: translateY(-110vh) scale(1.4); opacity: 0; }
    }

    /* النص المتحرك */
    .flying-love-text {
      position: fixed;
      font-size: 1.5rem;
      color: #ff758c;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255, 117, 140, 0.5);
      user-select: none;
      pointer-events: none;
      z-index: 2;
      white-space: nowrap;
      animation: flyAcross 8s linear infinite;
    }

    @keyframes flyAcross {
      0% { transform: translate(-150px, var(--start-y)); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(calc(100vw + 150px), var(--end-y)); opacity: 0; }
    }

    /* صورة ميرال الدائرية */
    .circle-container {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px auto;
      border: 3px solid rgba(255, 105, 180, 0.6);
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 105, 180, 0.4);
      background: rgba(255, 105, 180, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: pulse 1.5s infinite;
    }
    
    .circle-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* خطوط الأصوات */
    .audio-visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 5px;
      margin-bottom: 35px;
      height: 35px;
    }

    .bar {
      width: 4px;
      background: linear-gradient(to top, #ff758c, #ff7eb3);
      border-radius: 3px;
      animation: soundWave 0.8s infinite alternate;
    }

    .bar:nth-child(1) { height: 12px; animation-delay: 0.1s; }
    .bar:nth-child(2) { height: 25px; animation-delay: 0.3s; }
    .bar:nth-child(3) { height: 18px; animation-delay: 0.2s; }
    .bar:nth-child(4) { height: 32px; animation-delay: 0.4s; }
    .bar:nth-child(5) { height: 20px; animation-delay: 0.15s; }
    .bar:nth-child(6) { height: 28px; animation-delay: 0.25s; }
    .bar:nth-child(7) { height: 15px; animation-delay: 0.35s; }

    @keyframes soundWave {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1.3); }
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      padding: 15px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(255, 117, 140, 0.15), rgba(255, 105, 180, 0.25));
      color: #ff8fab;
      border: 1px solid rgba(255, 143, 171, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- الشاشة الأولى -->
  <div id="startScreen">
    <button class="start-btn" onclick="openSite()">اسمعي أغنيتك يا أميرتي</button>
  </div>

  <!-- الواجهة الرئيسية -->
  <div id="mainScreen">
    <div class="circle-container">
      <img src="miral.jpg" alt="Meme" onerror="this.style.display='none'; document.getElementById('fallbackIcon').style.display='block';">
      <span id="fallbackIcon" style="display:none; font-size:3rem;">❤️</span>
    </div>

    <div class="audio-visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="button-group">
      <button onclick="toggleAudio()" id="songToggleBtn" class="btn">⏸️ إيقاف / تشغيل الأغنية</button>
      <button onclick="alert('I Love You Meme ❤️')" class="btn">I Love You Meme</button>
    </div>
  </div>

  <audio id="bgMusic" src="song.mp3" loop></audio>

  <script>
    function openSite() {
      // 1. إخفاء شاشة البداية فوراً
      document.getElementById('startScreen').style.display = 'none';
      
      // 2. إظهار الواجهة الرئيسية فوراً
      document.getElementById('mainScreen').style.display = 'block';

      // 3. تشغيل الأغنية
      var music = document.getElementById('bgMusic');
      music.play().catch(function(e){ console.log(e); });

      // 4. تشغيل التأثيرات
      startBackgroundEffects();
    }

    function startBackgroundEffects() {
      // القلوب
      var heartSymbols = ['💖', '💗', '💓', '💕', '❤️', '🩷', '✨'];
      setInterval(function() {
        var heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
        document.body.appendChild(heart);
        setTimeout(function() { heart.remove(); }, 6000);
      }, 200);

      // كلمة I Love You Meme
      setInterval(function() {
        var textDiv = document.createElement('div');
        textDiv.className = 'flying-love-text';
        textDiv.innerText = "I Love You Meme ❤️";
        var startY = Math.random() * window.innerHeight;
        var endY = startY + (Math.random() * 200 - 100);
        textDiv.style.setProperty('--start-y', startY + 'px');
        textDiv.style.setProperty('--end-y', endY + 'px');
        document.body.appendChild(textDiv);
        setTimeout(function() { textDiv.remove(); }, 8000);
      }, 2000);
    }

    function toggleAudio() {
      var music = document.getElementById('bgMusic');
      var btn = document.getElementById('songToggleBtn');
      if (music.paused) {
        music.play();
        btn.innerText = '⏸️ إيقاف الأغنية';
      } else {
        music.pause();
        btn.innerText = '▶️ تشغيل الأغنية';
      }
    }
  </script>
</body>
</html>
